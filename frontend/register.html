<!DOCTYPE html>
<html>
<head>
    <title>Register</title>

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            background: linear-gradient(135deg, #a18cd1, #fbc2eb);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            width: 300px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        h2 {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
            border: 1px solid #ccc;
            transition: 0.3s;
        }

        input:focus {
            border-color: purple;
            box-shadow: 0 0 8px purple;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, purple, pink);
            border: none;
            color: white;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
        }

        a {
            text-decoration: none;
            color: purple;
        }
    </style>

</head>

<body>

<div class="box">
    <h2>📝 Register</h2>
    <input type="text" id="regUser" placeholder="Username">
    <input type="password" id="regPass" placeholder="Password">
    <button onclick="register()">Register</button>
    <p>Already user? <a href="login.html">Login</a></p>
</div>

<script>
function register() {
    let username = document.getElementById("regUser").value.trim();
    let password = document.getElementById("regPass").value.trim();

    if (!username || !password) {
        alert("Please fill all fields");
        return;
    }

    fetch("http://localhost:13.216.246.31:3000/register", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            username: username,
            password: password
        })
    })
    .then(res => res.json())
.then(data => {
    if (data.success) {
        alert("Registered Successfully!");
        window.location.href = "login.html";
    } else {
        alert("Registration failed");
    }
})
    .catch(err => {
        console.log(err);
        alert("Server error");
    });
}
</script>
</html>
