<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            width: 300px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            animation: fadeIn 1s ease-in-out;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
            border: 1px solid #ccc;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #ff758c;
            box-shadow: 0 0 8px #ff758c;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            border: none;
            color: white;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
        }

        a {
            text-decoration: none;
            color: #ff758c;
        }

        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(20px);}
            to {opacity: 1; transform: translateY(0);}
        }
    </style>

</head>

<body>

<div class="box">
    <h2>🔐 Login</h2>
    <input type="text" id="loginUser" placeholder="Username">
    <input type="password" id="loginPass" placeholder="Password">
    <button onclick="login()">Login</button>
    <p>New here? <a href="register.html">Register</a></p>
</div>

<script>
function login() {
    let username = document.getElementById("loginUser").value.trim();
    let password = document.getElementById("loginPass").value.trim();

    if (!username || !password) {
        alert("Please fill all fields");
        return;
    }

    fetch("http://13.216.246.31:3000/login", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            username: username,
            password: password
        })
    })
    .then(res => res.json())
    .then(data => {   // ✅ data defined here

        console.log("Login Response:", data); // 🔥 check this

        if (data.success) {

            // ✅ STORE FROM BACKEND (IMPORTANT)
            localStorage.setItem("user", data.user.username);
            localStorage.setItem("user_id", data.user.id);

            window.location.href = "index.html";

        } else {
            alert("Invalid Username or Password");
        }
    })
    .catch(err => {
        console.log("Error:", err);
        alert("Server error");
    });
}
</script>
</body>
</html>
