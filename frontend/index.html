<!DOCTYPE html>
<html>
<head>
    <title>Smart To-Do Pro</title>

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fbc2eb, #a6c1ee);
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            background: #ffffffcc;
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #444;
            margin-bottom: 20px;
        }

        .input-section {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr auto;
            gap: 10px;
            margin-bottom: 20px;
        }

        input, select {
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #ddd;
            background: #f9f9f9;
        }

        button {
            padding: 10px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            background: #a6c1ee;
            color: #333;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
            background: #fbc2eb;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .filters button {
            margin-right: 5px;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: #fff;
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 10px rgba(0,0,0,0.05);
        }

        .completed {
            text-decoration: line-through;
            opacity: 0.6;
        }

        .task-info {
            display: flex;
            flex-direction: column;
        }

        .task-info small {
            color: #777;
        }

        .btns button {
            margin-left: 5px;
        }

        .progress-bar {
            height: 10px;
            background: #eee;
            border-radius: 10px;
            margin-top: 10px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background: #a6c1ee;
            width: 0%;
        }

        .bottom-bar {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
        }

        .logout {
            background: #ffb3c6;
        }

        .logout:hover {
            background: #ff8fab;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>✨ Smart To-Do Pro</h1>
    <h3>Welcome, <span id="userName"></span> 👋</h3>
    <!-- INPUT -->
    <div class="input-section">
        <input type="text" id="taskInput" placeholder="Enter task">
        <input type="date" id="date">
        <input type="time" id="time">
        <select id="priority">
            <option>High</option>
            <option>Medium</option>
            <option>Low</option>
        </select>
        <button onclick="addTask()">Add</button>
    </div>

    <!-- TOP BAR -->
    <div class="top-bar">
        <input type="text" id="search" placeholder="🔍 Search..." onkeyup="displayTasks()">

        <div class="filters">
            <button onclick="filter='all';displayTasks()">All</button>
            <button onclick="filter='completed';displayTasks()">Done</button>
            <button onclick="filter='pending';displayTasks()">Pending</button>
        </div>
    </div>

    <!-- CALENDAR -->
    <input type="date" onchange="filterByDate(this.value)">

    <!-- TASK LIST -->
    <ul id="taskList"></ul>

    <!-- STATS -->
    <div id="stats"></div>

    <!-- PROGRESS -->
    <div class="progress-bar">
        <div class="progress" id="progress"></div>
    </div>

    <!-- BOTTOM -->
    <div class="bottom-bar">
        <button onclick="clearAll()">🗑 Clear</button>
        <button class="logout" onclick="logout()">Logout</button>
    </div>

</div>

<script>
if (!localStorage.getItem("user")) {
    window.location.href = "login.html";
}

let filter = "all";

if (Notification.permission !== "granted") {
    Notification.requestPermission();
}

// ➕ ADD TASK (API)
function addTask() {
    let user_id = localStorage.getItem("user_id");
    let username = localStorage.getItem("user");

    console.log("Sending:", user_id, username); // 🔥 debug

    fetch("http://13.216.246.31:3000/addTask", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            task: taskInput.value,
            date: date.value,
            time: time.value,
            priority: priority.value,
            user_id: user_id,
            username: username
        })
    }).then(() => displayTasks());
}

function editTask(id, oldTask) {
    let newTask = prompt("Edit task:", oldTask);

    if (!newTask) return;

    fetch(`http://13.216.246.31:3000/task/${id}`, {
        method: "PUT",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ task: newTask })
    }).then(() => displayTasks());
}
// 📊 DISPLAY TASKS (API)
function displayTasks() {
    let user_id = localStorage.getItem("user_id");

    fetch(`http://13.216.246.31:3000/tasks/${user_id}`)
    .then(res => res.json())
    .then(tasks => {

        let list = document.getElementById("taskList");
        let search = document.getElementById("search").value.toLowerCase();

        list.innerHTML = "";
        let completed = 0;

        tasks.forEach(t => {

            // 🔍 SEARCH FILTER
            if (!t.task.toLowerCase().includes(search)) return;

            // 🔥 STATUS FILTER (IMPORTANT FIX)
            if (filter === "completed" && !t.completed) return;
            if (filter === "pending" && t.completed) return;

            let li = document.createElement("li");

            if (t.completed) {
                li.classList.add("completed");
                completed++;
            }

            // ⏱️ FIXED COUNTDOWN
            let countdown = "";

            if (t.date && t.time) {

                let dateOnly = t.date.split("T")[0];
                let timeOnly = t.time.toString().slice(0,5);

                let deadline = new Date(`${dateOnly}T${timeOnly}:00`);
                let now = new Date();

                let diff = deadline - now;

                if (diff > 0) {
                    let h = Math.floor(diff / (1000 * 60 * 60));
                    let m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                    countdown = `⏳ ${h}h ${m}m left`;
                } else {
                    countdown = "⚠️ Overdue";
                }

            } else {
                countdown = "No deadline";
            }

            // 🧾 UI
            li.innerHTML = `
                <div class="task-info">
                    <strong>${t.task}</strong>
                    <small>📅 ${t.date ? t.date.split("T")[0] : ""} ⏰ ${t.time}</small>
                    <small>👤 ${t.username}</small>
                    <small>${countdown}</small>
                </div>

                <div class="btns">
                    <button onclick="toggle(${t.id}, ${t.completed})">✔</button>
                    <button onclick="editTask(${t.id}, \`${t.task}\`)">✏️</button>
                    <button onclick="deleteTask(${t.id})">❌</button>
                </div>
            `;

            list.appendChild(li);
        });

        // 📊 STATS
        document.getElementById("stats").innerText =
            `Total: ${tasks.length} | Done: ${completed}`;

        // 📈 PROGRESS
        let percent = tasks.length ? (completed / tasks.length) * 100 : 0;
        document.getElementById("progress").style.width = percent + "%";
    });
}
// ✔ TOGGLE COMPLETE
function toggle(id, currentStatus) {
    fetch(`http://13.216.246.31:3000/task/${id}`, {
        method: "PUT",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            completed: !currentStatus
        })
    }).then(() => displayTasks());
}

// ❌ DELETE TASK
function deleteTask(id) {
    fetch(`http://13.216.246.31:3000/${id}`, {
        method: "DELETE"
    }).then(() => displayTasks());
}

// 🗑 CLEAR ALL
function clearAll() {
    fetch("http://13.216.246.31:3000/tasks")
    .then(res => res.json())
    .then(tasks => {
        tasks.forEach(t => {
            fetch(`http://13.216.246.31:3000/task/${t.id}`, {
                method: "DELETE"
            });
        });
        displayTasks();
    });
}

// 🚪 LOGOUT
function logout() {
    localStorage.removeItem("user");
    window.location.href = "login.html";
}

// 📅 FILTER BY DATE
function filterByDate(d) {
    fetch("http://13.216.246.31:3000/tasks")
    .then(res => res.json())
    .then(tasks => {
        let list = document.getElementById("taskList");
        list.innerHTML = "";

        tasks.forEach(t => {
            if (t.date === d) {
                let li = document.createElement("li");
                li.innerText = t.task + " ⏰ " + t.time;
                list.appendChild(li);
            }
        });
    });
}
document.getElementById("userName").innerText = localStorage.getItem("user");

displayTasks();
displayTasks();
setInterval(displayTasks, 60000);
</script>

</body>
</html>
